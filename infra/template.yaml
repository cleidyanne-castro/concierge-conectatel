AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Concierge ConectaTel - tool retrieve_kb + gateway (API GW -> AgentCore) + HTTP API + Escalonamento (DynamoDB)

Parameters:
  KnowledgeBaseBucketName:
    Type: String
    Description: >-
      Bucket S3 da conta de demonstracao, ja existente, com index/embeddings.json
      e processed/chunks.json. O stack nao cria o bucket, so le dele.
  AgentRuntimeArn:
    Type: String
    Description: ARN do AgentCore Runtime da conta de demonstracao que o gateway invoca.
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Origem permitida no CORS da API.

Resources:

  # -------- Tool de busca (imagem). Rota de debug POST /retrieve --------
  RetrieveKbFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: concierge-conectatel-retrieve-kb
      PackageType: Image
      MemorySize: 10240
      Timeout: 60
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref KnowledgeBaseBucketName
          RETRIEVAL_SCORE_THRESHOLD: "0.85"
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref KnowledgeBaseBucketName
      Events:
        PostRetrieve:
          Type: HttpApi
          Properties:
            Path: /retrieve
            Method: POST
    Metadata:
      Dockerfile: infra/retrieve_kb.Dockerfile
      DockerContext: ../
      DockerTag: latest

  # -------- Tabela DynamoDB para Handoff (José) --------
  EscalonamentosTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: concierge-conectatel-escalonamentos
      PrimaryKey:
        Name: trace_id
        Type: String

  # -------- Lambda de Armazenamento do Handoff (José) --------
  StoreHandoffFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: concierge-conectatel-store-handoff
      Runtime: python3.12
      Handler: store_handoff_lambda.handler
      CodeUri: ../src/parte_03_04_agente_triagem/
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref EscalonamentosTable
      Policies:
        - Statement:
            - Sid: PersistOnlyHandoffRecords
              Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt EscalonamentosTable.Arn

  # -------- Borda: API Gateway (HTTP API) -> AgentCore Runtime --------
  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: concierge-conectatel-gateway
      Runtime: python3.12
      Handler: lambda_gateway.handler
      CodeUri: ../src/parte_03_04_agente_triagem/
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
      Policies:
        - Statement:
            - Sid: InvokeAgentRuntime
              Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              Resource:
                - !Ref AgentRuntimeArn
                - !Sub "${AgentRuntimeArn}/*"
      Events:
        PostConcierge:
          Type: HttpApi
          Properties:
            Path: /concierge
            Method: POST
        OptionsConcierge:
          Type: HttpApi
          Properties:
            Path: /concierge
            Method: OPTIONS

  # -------- Observabilidade operacional (Parte 5) --------
  GatewayErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: concierge-conectatel-gateway-errors
      AlarmDescription: Erro tratado ou não tratado no gateway; investigar pelo trace_id.
      Namespace: ConciergeConectaTel/Operations
      MetricName: GatewayRuntimeErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RetrieveKbErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: concierge-conectatel-retrieve-kb-errors
      AlarmDescription: Erro na tool RAG; investigar pelo trace_id e pelos logs da Lambda.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RetrieveKbFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RespondDecisionMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/lambda/concierge-conectatel-gateway
      FilterPattern: '{ $.decision = "responder" }'
      MetricTransformations:
        - MetricNamespace: ConciergeConectaTel/Operations
          MetricName: RespondDecisions
          MetricValue: '1'

  NoAnswerDecisionMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/lambda/concierge-conectatel-gateway
      FilterPattern: '{ $.decision = "nao_sei" }'
      MetricTransformations:
        - MetricNamespace: ConciergeConectaTel/Operations
          MetricName: NoAnswerDecisions
          MetricValue: '1'

  EscalateDecisionMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/lambda/concierge-conectatel-gateway
      FilterPattern: '{ $.decision = "escalar" }'
      MetricTransformations:
        - MetricNamespace: ConciergeConectaTel/Operations
          MetricName: EscalateDecisions
          MetricValue: '1'

  GatewayRuntimeErrorMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/lambda/concierge-conectatel-gateway
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricNamespace: ConciergeConectaTel/Operations
          MetricName: GatewayRuntimeErrors
          MetricValue: '1'

  OperationalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: concierge-conectatel-operacao
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Gateway - invocações, erros e latência p95",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "concierge-conectatel-gateway", {"stat": "Sum", "label": "Invocações"}],
                  [".", "Errors", ".", ".", {"stat": "Sum", "label": "Falhas não tratadas"}],
                  [".", "Duration", ".", ".", {"stat": "p95", "label": "Duração p95 (ms)", "yAxis": "right"}],
                  ["ConciergeConectaTel/Operations", "GatewayRuntimeErrors", {"stat": "Sum", "label": "Erros HTTP"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "RAG - invocações, erros e latência p95",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "concierge-conectatel-retrieve-kb", {"stat": "Sum", "label": "Invocações"}],
                  [".", "Errors", ".", ".", {"stat": "Sum", "label": "Erros"}],
                  [".", "Duration", ".", ".", {"stat": "p95", "label": "Duração p95 (ms)", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Decisões do Concierge",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["ConciergeConectaTel/Operations", "RespondDecisions", {"stat": "Sum", "label": "Responder"}],
                  [".", "NoAnswerDecisions", {"stat": "Sum", "label": "Não sei"}],
                  [".", "EscalateDecisions", {"stat": "Sum", "label": "Escalar"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB - handoffs persistidos",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["AWS/DynamoDB", "SuccessfulRequestLatency", "TableName", "concierge-conectatel-escalonamentos", "Operation", "PutItem", {"stat": "SampleCount", "label": "PutItem (handoffs)"}]
                ]
              }
            }
          ]
        }

Outputs:
  KnowledgeBaseBucketName:
    Description: Bucket lido pela tool retrieve_kb
    Value: !Ref KnowledgeBaseBucketName
  ConciergeApiUrl:
    Description: 'Endpoint principal - POST {question, trace_id}'
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/concierge"
  RetrieveKbApiUrl:
    Description: 'Debug - POST direto na tool de busca'
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/retrieve"
  GatewayFunctionArn:
    Value: !GetAtt GatewayFunction.Arn
  StoreHandoffFunctionArn:
    Description: 'ARN da Lambda de persistência de Handoff'
    Value: !GetAtt StoreHandoffFunction.Arn
  OperationalDashboardName:
    Description: Dashboard CloudWatch para observabilidade operacional.
    Value: !Ref OperationalDashboard
